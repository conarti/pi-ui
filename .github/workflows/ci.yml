name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Provide search binaries for offline InteractiveMode tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fd-find ripgrep
          mkdir -p "$RUNNER_TEMP/pi-bin"
          ln -s "$(command -v fdfind)" "$RUNNER_TEMP/pi-bin/fd"
          echo "$RUNNER_TEMP/pi-bin" >> "$GITHUB_PATH"
      - name: Install pinned host Pi runtime outside project node_modules
        run: |
          PI_HOST_VERSION="$(node scripts/resolve-host-pi.mjs --print-expected-version)"
          npm install -g "@earendil-works/pi-coding-agent@${PI_HOST_VERSION}"
      - name: Install dev dependencies with peer isolation
        run: npm ci --legacy-peer-deps
      - name: Run standards lint, typecheck, and test suite
        env:
          # Match the RGB terminal used by the visual assertions; palette tests override it.
          COLORTERM: truecolor
          TERM: xterm-256color
        run: npm run check
